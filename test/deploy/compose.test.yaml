# Test only (run.sh): SWAG is a container on the test network whose alias is
# OC_DOMAIN, not this host's 443, and its certificate is self-signed
services:
  opencloud:
    extra_hosts: !reset []
    environment:
      OC_INSECURE: "true"
  manage-api:
    environment:
      # The restart check needn't wait 90 s for the API to follow OpenCloud
      MANAGE_API_WATCHDOG: 15s
