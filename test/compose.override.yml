# Runs the test environment's OpenCloud on an oc-custom image, with a branding
# folder. Added to the test environment's compose files by test/use-custom.
services:
  opencloud:
    image: ${OC_CUSTOM_IMAGE:?set OC_CUSTOM_IMAGE}
    volumes:
      - ${OC_CUSTOM_BRANDING:?set OC_CUSTOM_BRANDING}:/var/lib/opencloud/web/assets/themes/_branding:ro
