# Builds the image in GitHub Actions (the build needs more RAM than a small VM
# has). A tag v<oc version>-<build> (matching versions.env) publishes
# ghcr.io/<owner>/oc-custom:<oc version>-<build> and then a GitHub release
# for the tag; a manual run publishes :test-<sha> for trying a build in the
# test env first.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes with git; don't leave the token in .git/config
          persist-credentials: false
      - id: tag
        name: Image tag
        run: |
          source versions.env
          version="${OC_VERSION#v}-$BUILD"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match versions.env (v$version)"; exit 1; }
            tag="$version"
          else
            tag="test-${GITHUB_SHA::7}"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oc-custom:$tag" >>"$GITHUB_OUTPUT"
          # build-native decides whether the cached web is still good (its key also
          # covers the node image and pnpm); this one only has to change with them
          echo "web=web-$WEB_VERSION-${{ hashFiles('patches/web/*.patch', 'versions.env', 'scripts/build-native') }}" >>"$GITHUB_OUTPUT"
      # Caches speed up manual test builds only. A release (tag) builds from
      # nothing, so no cache another run wrote can end up in it.
      # The patched web: rebuilt only when its version or patches change
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: out/web-dist
          key: ${{ steps.tag.outputs.web }}
      # pnpm store, Go modules and build cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: ~/.cache/oc-custom
          key: build-${{ hashFiles('versions.env', 'patches/**') }}-${{ github.run_id }}
          restore-keys: |
            build-${{ hashFiles('versions.env', 'patches/**') }}-
            build-
      - name: Build
        run: scripts/build-native "${{ steps.tag.outputs.image }}"
      - name: Smoke test
        run: scripts/smoke-test "${{ steps.tag.outputs.image }}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          image="${{ steps.tag.outputs.image }}"
          # Published tags are never overwritten
          if [ "$GITHUB_REF_TYPE" = tag ] && docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image exists already; bump BUILD in versions.env"; exit 1
          fi
          docker push "$image"
          echo "Pushed \`$image\`" >>"$GITHUB_STEP_SUMMARY"

  # Only after the image is built, smoke-tested and pushed. Its own job, so the
  # token that may write to the repo never reaches the build's steps.
  release:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # The notes cover the PRs since the previous tag: without an earlier
          # GitHub release, --generate-notes alone would start at the first commit
          previous="$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' |
            grep -E '^v[0-9]' | sort -V | grep -B1 -xF "$GITHUB_REF_NAME" | grep -vxF "$GITHUB_REF_NAME" || true)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Image: \`$IMAGE\`" --generate-notes ${previous:+--notes-start-tag "$previous"}
