# Authelia as OpenCloud's sign-in, under https://<OC_DOMAIN>/authelia.
# {{ env "OC_DOMAIN" }} comes from .env (X_AUTHELIA_CONFIG_FILTERS=template);
# the secrets are files in authelia/secrets (setup.sh), the notifier is set
# from SMTP_* in compose.authelia.yaml.
# OpenCloud's four clients keep their default ids, so the apps need no
# settings. 2FA (TOTP) is required for the admins group and for users in
# the 2fa group.
theme: auto

server:
  # Under a path on OpenCloud's own name: one DNS record, one certificate
  address: tcp://0.0.0.0:9091/authelia

log:
  level: info

totp:
  issuer: {{ env "OC_DOMAIN" }}

authentication_backend:
  file:
    # Written by users.sh (whole file, checked, then renamed into place)
    path: /config/users/users_database.yml
    watch: true

# Checked when users choose a password on Authelia's pages (change, reset).
# Length only. Short on purpose for now; raise it here and in lib.sh
# (PASSWORD_MIN_LENGTH) together.
password_policy:
  standard:
    enabled: true
    min_length: 3

# OpenCloud's clients have their own policy below; nothing else is protected
access_control:
  default_policy: one_factor

session:
  cookies:
    - domain: {{ env "OC_DOMAIN" }}
      authelia_url: https://{{ env "OC_DOMAIN" }}/authelia

storage:
  local:
    path: /data/db.sqlite3

identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc.key" | mindent 10 "|" | msquote }}
    lifespans:
      custom:
        opencloud:
          access_token: 1h
          refresh_token: 30d
    authorization_policies:
      opencloud:
        default_policy: one_factor
        rules:
          # Admins always; other users when they're in the 2fa group
          # (users.sh 2fa, the management API)
          - policy: two_factor
            subject:
              - group:admins
              - group:2fa
    cors:
      endpoints: [authorization, token, revocation, introspection, userinfo]
      allowed_origins_from_client_redirect_uris: true
    clients:
      - client_id: web
        client_name: OpenCloud
        public: true
        authorization_policy: opencloud
        lifespan: opencloud
        # The web asks for no refresh token, so no consent page
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://{{ env "OC_DOMAIN" }}/
          - https://{{ env "OC_DOMAIN" }}/oidc-callback.html
          - https://{{ env "OC_DOMAIN" }}/oidc-silent-redirect.html
        scopes: [openid, offline_access, groups, profile, email]
        response_types: [code]
        grant_types: [authorization_code, refresh_token]
        access_token_signed_response_alg: RS256
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: none
      # The apps get a refresh token (offline_access), which in Authelia always
      # needs consent: one consent page when an account is added (or after the
      # refresh token runs out), not at every start
      - client_id: OpenCloudDesktop
        client_name: OpenCloud Desktop
        public: true
        authorization_policy: opencloud
        lifespan: opencloud
        consent_mode: explicit
        require_pkce: true
        pkce_challenge_method: S256
        # Any port: the desktop app listens on a random one
        redirect_uris:
          - http://127.0.0.1
          - http://localhost
        scopes: [openid, offline_access, groups, profile, email]
        response_types: [code]
        grant_types: [authorization_code, refresh_token]
        access_token_signed_response_alg: RS256
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: none
      - client_id: OpenCloudAndroid
        client_name: OpenCloud Android
        public: true
        authorization_policy: opencloud
        lifespan: opencloud
        consent_mode: explicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - oc://android.opencloud.eu
        scopes: [openid, offline_access, groups, profile, email]
        response_types: [code]
        grant_types: [authorization_code, refresh_token]
        access_token_signed_response_alg: RS256
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: none
      - client_id: OpenCloudIOS
        client_name: OpenCloud iOS
        public: true
        authorization_policy: opencloud
        lifespan: opencloud
        consent_mode: explicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - oc://ios.opencloud.eu
          - oc.ios://ios.opencloud.eu
        scopes: [openid, offline_access, groups, profile, email]
        response_types: [code]
        grant_types: [authorization_code, refresh_token]
        access_token_signed_response_alg: RS256
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: none
